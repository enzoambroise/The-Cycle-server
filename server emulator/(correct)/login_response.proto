syntax = "proto3";

import "google/protobuf/any.proto"; 

// ===========================================
// Services et Requêtes
// ===========================================

service GatewayService {
  rpc Login(LoginRequest) returns (LoginResponse);
}

message LoginRequest {
  string username = 1;
  string password = 2;
  string client_version = 3;
}

// ===========================================
// Message de Réponse Critique
// ===========================================

message LoginResponse {
  enum Result {
    OK = 0;
    INVALID_TOKEN = 1;
    ALREADY_CONNECTED = 2; 
    INVALID_VERSION = 3;
  }

  Result result = 1;
  string session_id = 2; 
  string username = 3;
  string user_id = 4;
  
  // NOUVEAU CHAMP: Flag d'initialisation (très souvent un booléen au Tag 5)
  bool is_initialized = 5;
  
  // 🔑 CHAMP CRITIQUE: Gros paquet P7 au Tag 6, type bytes (simple).
  bytes large_init_packet = 6;
}

// ===========================================
// Autres Messages
// ===========================================

message NDAStatus {
    bool nda = 1; 
}

message Pong {
    int32 server_time_ms = 1;
}